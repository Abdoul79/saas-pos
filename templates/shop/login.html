{% extends "shop/base.html" %}
{% block title %}Connexion — {{ tenant.nom_boutique }}{% endblock %}
{% block head %}
<style>
  .login-box { max-width:400px;margin:2rem auto; }
  .login-title { font-size:1.25rem;font-weight:800;margin-bottom:1.5rem;text-align:center; }

  /* Séparateur */
  .or-sep { display:flex;align-items:center;gap:.75rem;margin:1rem 0;color:var(--muted);font-size:.78rem; }
  .or-sep::before,.or-sep::after { content:'';flex:1;height:1px;background:var(--border); }

  /* Bouton Google */
  .btn-google {
    width:100%;display:flex;align-items:center;justify-content:center;gap:.65rem;
    padding:.65rem 1rem;border-radius:9px;
    border:1.5px solid #e2e8f0;background:#fff;
    font-size:.88rem;font-weight:600;color:#374151;
    cursor:pointer;transition:all .15s;text-decoration:none;
  }
  .btn-google:hover { border-color:#4285f4;background:#f0f6ff;box-shadow:0 2px 10px rgba(66,133,244,.1); }
  .google-icon { width:20px;height:20px;flex-shrink:0; }
</style>
{% endblock %}

{% block content %}
<div class="login-box">
  <div class="login-title">🔐 Connexion</div>

  <!-- Google OAuth -->
  <a href="{{ url_for('shop.google_login', slug=tenant.shop_slug) }}" class="btn-google">
    <svg class="google-icon" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continuer avec Google
  </a>

  <div class="or-sep">ou</div>

  <!-- Formulaire email/mdp -->
  <form method="POST" class="card" style="padding:1.25rem;">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required autofocus placeholder="vous@exemple.com">
    </div>
    <div class="form-group">
      <label class="form-label">Mot de passe</label>
      <input type="password" name="password" class="form-control" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Se connecter</button>
  </form>

  <div style="text-align:center;margin-top:.85rem;font-size:.84rem;color:var(--muted);">
    Pas encore de compte ?
    <a href="{{ url_for('shop.register', slug=tenant.shop_slug) }}" style="color:var(--accent);font-weight:600;">Créer un compte</a>
  </div>
</div>
{% endblock %}
