{% extends "shop/base.html" %}
{% block title %}Inscription — {{ tenant.nom_boutique }}{% endblock %}
{% block content %}
<div style="max-width:500px;margin:2rem auto;">
  <h1 style="font-size:1.4rem;font-weight:800;margin-bottom:1.5rem;text-align:center;">Créer un compte</h1>
  <form method="POST" class="card" style="padding:1.5rem;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
      <div class="form-group"><label class="form-label">Prénom</label><input name="prenom" class="form-control" required></div>
      <div class="form-group"><label class="form-label">Nom</label><input name="nom" class="form-control" required></div>
    </div>
    <div class="form-group"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
    <div class="form-group"><label class="form-label">Téléphone</label><input name="telephone" class="form-control"></div>
    <div class="form-group"><label class="form-label">Ville</label><input name="ville" class="form-control"></div>
    <div class="form-group"><label class="form-label">Adresse</label><textarea name="adresse" class="form-control" rows="2"></textarea></div>
    <div class="form-group"><label class="form-label">Mot de passe</label><input type="password" name="password" class="form-control" required minlength="6"></div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Créer mon compte</button>
  </form>
  <div style="text-align:center;margin-top:1rem;font-size:.88rem;color:var(--muted);">
    Déjà un compte ? <a href="{{ url_for('shop.login', slug=tenant.shop_slug) }}" style="color:var(--accent);font-weight:600;">Se connecter</a>
  </div>
</div>
{% endblock %}
