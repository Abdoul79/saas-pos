<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — SaaS POS</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0d0f14;--surface:#161a22;--border:#252b38;--text:#e8eaf0;--muted:#7a8099;--accent:#f5a623;--danger:#dc2626;--success:#16a34a;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif; }
    * { box-sizing:border-box;margin:0;padding:0; }
    body { background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center; }
    .alerts { position:fixed;top:1rem;right:1rem;z-index:999; }
    .alert { padding:.75rem 1.25rem;border-radius:8px;font-size:.85rem;margin-bottom:.5rem; }
    .alert-danger  { background:#dc262622;border:1px solid #dc262644;color:#f87171; }
    .alert-success { background:#16a34a22;border:1px solid #16a34a44;color:#4ade80; }

    .box { width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:2.5rem; }
    .logo { font-family:var(--mono);font-size:1.1rem;color:var(--accent);margin-bottom:1.75rem; }
    .logo span { color:var(--muted); }
    .title { font-size:1.3rem;font-weight:700;margin-bottom:.4rem; }
    .sub   { font-size:.84rem;color:var(--muted);margin-bottom:1.75rem;line-height:1.5; }
    .form-label { display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-bottom:.35rem; }
    .form-control { width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.7rem .9rem;color:var(--text);font-size:.875rem;transition:border-color .15s;margin-bottom:1rem; }
    .form-control:focus { outline:none;border-color:var(--accent); }
    .strength-bar { height:4px;border-radius:99px;background:var(--border);margin-top:-0.75rem;margin-bottom:1rem;transition:all .3s; }
    .btn { width:100%;padding:.75rem;background:var(--accent);color:#0d0f14;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:.5rem;transition:opacity .15s; }
    .btn:hover { opacity:.88; }
    .hint { font-size:.72rem;color:var(--muted);margin-top:.2rem;margin-bottom:.75rem; }
    .back { text-align:center;margin-top:1.25rem;font-size:.82rem;color:var(--muted); }
    .back a { color:var(--accent);text-decoration:none; }
  </style>
</head>
<body>
  <div class="alerts">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
  </div>

  <div class="box">
    <div class="logo">▣ SaaS<span>POS</span></div>
    <div class="title">Nouveau mot de passe</div>
    <div class="sub">Choisissez un mot de passe sécurisé d'au moins 8 caractères.</div>

    <form method="POST">
      <label class="form-label">Nouveau mot de passe</label>
      <input class="form-control" type="password" name="password" id="pwd"
             required placeholder="Min. 8 caractères" oninput="checkStrength(this.value)">
      <div class="strength-bar" id="sbar"></div>

      <label class="form-label">Confirmer le mot de passe</label>
      <input class="form-control" type="password" name="confirm" id="conf"
             required placeholder="Répéter le mot de passe" oninput="checkMatch()">
      <div class="hint" id="matchHint"></div>

      <button type="submit" class="btn">Enregistrer le nouveau mot de passe →</button>
    </form>

    <div class="back"><a href="{{ url_for('auth.login') }}">← Retour à la connexion</a></div>
  </div>

  <script>
  function checkStrength(v) {
    const bar = document.getElementById('sbar');
    const checks = [v.length >= 8, /[A-Z]/.test(v), /[0-9]/.test(v), /[^A-Za-z0-9]/.test(v)];
    const score  = checks.filter(Boolean).length;
    const colors = ['#ef4444','#f97316','#eab308','#22c55e'];
    bar.style.background = colors[score - 1] || '#252b38';
    bar.style.width = (score * 25) + '%';
  }
  function checkMatch() {
    const pw   = document.getElementById('pwd').value;
    const conf = document.getElementById('conf').value;
    const hint = document.getElementById('matchHint');
    if (!conf) { hint.textContent = ''; return; }
    hint.textContent = pw === conf ? '✓ Correspondent' : '✕ Ne correspondent pas';
    hint.style.color = pw === conf ? '#4ade80' : '#f87171';
  }
  </script>
</body>
</html>
