
{% extends "base.html" %}
{% block title %}Code-Barres — {{ product.designation }}{% endblock %}
{% block head %}
<style>
  @page {
    size: 58mm 40mm;
    margin: 0;
  }

  @media print {
    .no-print { display:none !important; }
    body > *:not(main) { display:none !important; }
    main { padding:0 !important;margin:0 !important; }
    .print-area { margin:0;padding:0; }
    .label-sheet { display:block; }
    .label-item {
      border:none;
      border-radius:0;
      box-shadow:none;
      margin:0;
      page-break-after:always;
      break-after:page;
    }
  }

  .label-sheet {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.75rem;
    padding:.5rem;
  }

  .label-item {
    width:58mm;
    height:40mm;
    box-sizing:border-box;
    border:1px solid #ddd;border-radius:1.5mm;
    padding:1.5mm 2mm;
    text-align:center;
    background:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:.4mm;
    overflow:hidden;
  }
  .label-name {
    font-size:2.4mm;font-weight:700;color:#111;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    width:100%;
    line-height:1.2;
    flex-shrink:0;
  }
  .label-barcode {
    width:100%;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .label-barcode img { max-width:90%;max-height:100%;width:auto;height:auto;display:block;margin:0 auto; }
  .label-code {
    font-size:1.9mm;color:#555;
    font-family:monospace;
    line-height:1.15;
    flex-shrink:0;
  }
  .label-price {
    font-size:3mm;font-weight:800;color:#f5a623;
    line-height:1.1;
    flex-shrink:0;
  }
</style>
{% endblock %}

{% block content %}
<!-- Contrôles (pas imprimés) -->
<div class="no-print" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem;">
  <div>
    <div class="page-title" style="margin-bottom:0;">Étiquettes (40×58mm)</div>
    <div style="font-size:.82rem;color:var(--muted);">{{ product.designation }}</div>
  </div>
  <div style="display:flex;gap:.5rem;align-items:center;">
    <label style="font-size:.82rem;color:var(--muted);">Quantité :</label>
    <input type="number" id="qtyInput" value="12" min="1" max="60"
           style="width:60px;padding:.35rem .5rem;border:1px solid var(--border);border-radius:6px;font-size:.88rem;text-align:center;"
           onchange="buildSheet()">
    <button onclick="window.print()" class="btn btn-primary btn-sm">🖨 Imprimer</button>
    <a href="{{ url_for('manager.products') }}" class="btn btn-secondary btn-sm">← Retour</a>
  </div>
</div>

<!-- Zone d'impression -->
<div class="print-area">
  <div class="label-sheet" id="labelSheet"></div>
</div>

{% endblock %}

{% block scripts %}
<script>
var BC_B64  = '{{ bc_b64 or "" }}';
var NAME    = {{ product.designation | tojson }};
var CODE    = {{ (product.barcode or '') | tojson }};
var PRICE   = '{{ product.prix_vente_ttc|int }} FCFA';
var SKU     = {{ (product.sku or '') | tojson }};

function buildSheet() {
  var qty = Math.max(1, Math.min(60, parseInt(document.getElementById('qtyInput').value) || 12));
  var sheet = document.getElementById('labelSheet');
  sheet.innerHTML = '';
  for (var i = 0; i < qty; i++) {
    var div = document.createElement('div');
    div.className = 'label-item';
    div.innerHTML =
      '<div class="label-name" title="'+NAME+'">'+NAME+'</div>' +
      (BC_B64
        ? '<div class="label-barcode"><img src="data:image/png;base64,'+BC_B64+'" alt="barcode"></div>'
        : '<div style="height:8mm;line-height:8mm;font-size:2mm;color:#aaa;">—</div>') +
      '<div class="label-code">'+CODE+'</div>' +
      (SKU ? '<div class="label-code" style="color:#999;">'+SKU+'</div>' : '') +
      '<div class="label-price">'+PRICE+'</div>';
    sheet.appendChild(div);
  }
}

buildSheet();
</script>
{% endblock %}
